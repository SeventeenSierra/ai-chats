# Gemini Oracle - Local Development Stack
# Based on proposal-prepper pattern with security hardening

services:
  web:
    build:
      context: ../..
      dockerfile: infra/web.Containerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # database is now sqlite at data/gemini.db
      - S3_ENDPOINT_URL=http://garage:3900
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-conversations}
    depends_on:
      garage:
        condition: service_started
    volumes:
      - ../../apps/ai-chats:/app/apps/ai-chats
      - ../../shared:/app/shared
      - ../../backend:/app/backend
      - ../../ai:/app/ai
      - /app/apps/ai-chats/node_modules
      - /app/apps/ai-chats/.next
    command: pnpm dev
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      gemini-network:
        aliases:
          - web-app

  garage:
    image: dxflrs/garage:v1.0.1
    ports:
      - "3900:3900" # S3 API
      - "3902:3902" # Admin API
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ../../garage.toml:/etc/garage.toml:ro
    command: /garage -c /etc/garage.toml server
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      gemini-network:
        aliases:
          - object-storage

volumes:
  garage_data:
    driver: local
  garage_meta:
    driver: local

networks:
  gemini-network:
    driver: bridge
